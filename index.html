<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>呦呦的红火箭阅读乐园</title>
<style>
:root{
  --ink:#2e2a44; --muted:#7d7790; --purple:#7b61d6; --purple-d:#5d47b8;
  --gold:#ffb524; --gold-d:#e59400; --card:#fff; --line:#ebe4f7;
  --shadow:0 10px 30px rgba(86,64,150,.12); --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); min-height:100vh; line-height:1.6;
  background:radial-gradient(circle at 12% 8%,#fff3d6 0,transparent 30%),
             radial-gradient(circle at 88% 12%,#e5e9ff 0,transparent 32%),
             linear-gradient(160deg,#fffdf8 0%,#f6f3ff 58%,#eef7ff 100%);
  background-attachment:fixed;
}
.shell{max-width:1180px;margin:0 auto;padding:26px 22px 60px}

/* 顶部鼓励语 */
.hero{text-align:center;padding:8px 10px 24px;position:relative}
.hero .spark{position:absolute;color:#ffd77a;font-size:22px;opacity:.85;animation:twinkle 2.8s ease-in-out infinite}
.hero .s1{left:6%;top:14px}.hero .s2{right:8%;top:22px;animation-delay:.7s}
.hero .s3{left:17%;bottom:2px;animation-delay:1.4s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}
.cheer{
  display:inline-block;font-size:clamp(18px,2.5vw,27px);font-weight:900;letter-spacing:.5px;
  color:#6b4fc4;background:linear-gradient(120deg,#fff9e8,#f3ecff);
  border:2px solid #e9d9ff;border-radius:999px;padding:12px 28px;
  box-shadow:var(--shadow);
}
.brand{margin-top:12px;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:2px}
.brand b{color:var(--purple-d)}

.layout{display:grid;grid-template-columns:minmax(280px,.76fr) minmax(520px,1.5fr);gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid #eadcff;border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 4px}
.panel-head h2{font-size:17px;font-weight:900;display:flex;align-items:center;gap:9px}
.panel-head h2::after{content:"✦ ✦";color:#ffd77a;font-size:12px;letter-spacing:2px;margin-left:2px}
.panel-head h2 svg{width:20px;height:20px;flex:none}
.sub{font-size:11.5px;color:var(--muted)}

/* 日历 */
.cal{padding:4px 16px 15px}
.cal-bar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 9px}
.cal-title{font-size:15px;font-weight:800;color:var(--purple-d)}
.nav{display:flex;gap:6px}
.nav button{
  width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:#faf8ff;
  color:var(--purple-d);font-size:16px;line-height:1;cursor:pointer;transition:.18s;
}
.nav button:hover{background:#efe8ff;transform:translateY(-1px)}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekdays{margin-bottom:5px}
.weekdays span{text-align:center;font-size:11px;font-weight:800;color:#a29bb4;padding:2px 0}
.weekdays span.we{color:#e08a5b}
.day{
  min-height:44px;border:1px solid #f0ebf8;border-radius:10px;background:#fdfcff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  position:relative;padding:2px;
}
.day .num{font-size:12px;font-weight:700;color:#6b6580}
.day.out{opacity:.32}
.day.today{border:2px solid var(--purple);background:#f6f1ff;box-shadow:0 0 0 2px rgba(123,97,214,.12)}
.day.today .num{color:var(--purple-d);font-weight:900}
.day.future{background:#fbfafc}
.star{width:16px;height:16px;display:block}
.star path{fill:#e9e4f2}
.day.lit{background:linear-gradient(160deg,#fffaf0,#fff4d9);border-color:#ffe0a3}
.day.lit .star path{fill:var(--gold);filter:drop-shadow(0 1px 3px rgba(255,181,36,.65))}
.day.lit .num{color:#a96c00}
.cal-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding:9px 10px;
  background:linear-gradient(100deg,#fff8e8,#f7f1ff);border-radius:11px;font-size:11.5px;color:#6b6180}
.cal-foot b{color:var(--gold-d);font-size:15px}
.legend{display:flex;align-items:center;gap:5px}
.legend svg{width:14px;height:14px}.legend svg path{fill:var(--gold)}

/* 书本卡片 */
.books{padding:4px 18px 16px}
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.card{
  display:block;position:relative;overflow:hidden;border-radius:15px;text-decoration:none;
  background:#eee9f7;border:2px solid #e6ddf6;aspect-ratio:3/4;
  box-shadow:0 8px 20px rgba(70,50,120,.13);transition:transform .22s,box-shadow .22s,border-color .22s;
  -webkit-tap-highlight-color:transparent;
}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover{transform:translateY(-4px);border-color:#c9b3f5;box-shadow:0 16px 34px rgba(91,66,160,.24)}
.card:hover img{transform:scale(1.045)}
/* 点击时的 3D 倾斜由 JS 写入：perspective(1000px) + 最大 8 度 + scale(1.02) */
.card-tag{
  position:absolute;left:0;right:0;bottom:0;padding:22px 6px 9px;text-align:center;
  background:linear-gradient(transparent,rgba(36,25,66,.78));color:#fff;font-size:12px;font-weight:800;
  letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card:hover .card-tag{background:linear-gradient(transparent,rgba(36,25,66,.9))}
.hint{margin-top:12px;text-align:center;font-size:12px;color:#9b93ad}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .book-grid{gap:10px}
  .day{min-height:40px}
}
@media(max-width:520px){
  .shell{padding:18px 13px 40px}
  .cheer{font-size:17px;padding:10px 16px}
  .book-grid{grid-template-columns:1fr;gap:14px}
  .card{aspect-ratio:16/10}
  .card img{object-position:center 28%}
}
</style>
</head>

<script>
(function(){
  /* ---------- 阅读打卡 ---------- */
  var KEY = 'yy_redrocket_visit_days_v1';
  var starSVG = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"/></svg>';
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  var visited = {};
  try { visited = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ visited = {}; }
  var now = new Date();
  var todayKey = keyOf(now);
  visited[todayKey] = true;
  try { localStorage.setItem(KEY, JSON.stringify(visited)); } catch(e){}

  var view = new Date(now.getFullYear(), now.getMonth(), 1);
  var daysEl = document.getElementById('days');
  var titleEl = document.getElementById('calTitle');

  function render(){
    var y = view.getFullYear(), m = view.getMonth();
    titleEl.textContent = y + ' 年 ' + (m+1) + ' 月';
    var first = new Date(y, m, 1).getDay();
    var total = new Date(y, m+1, 0).getDate();
    var html = '', litCount = 0;
    for(var i=0;i<first;i++) html += '<div class="day out"></div>';
    for(var d=1;d<=total;d++){
      var ds = y + '-' + pad(m+1) + '-' + pad(d);
      var isToday = (ds === todayKey);
      var lit = !!visited[ds];
      if(lit) litCount++;
      var future = new Date(y,m,d) > now;
      var cls = 'day' + (isToday?' today':'') + (lit?' lit':'') + (future?' future':'');
      html += '<div class="' + cls + '" data-date="' + ds + '"' + (lit?' title="这一天已点亮星星"':'') + '>'
           +  '<span class="num">' + d + '</span>' + (lit?starSVG:'') + '</div>';
    }
    daysEl.innerHTML = html;
    document.getElementById('monthCount').textContent = litCount;
    document.getElementById('totalCount').textContent = Object.keys(visited).filter(function(k){return visited[k];}).length;
  }
  document.getElementById('prevM').addEventListener('click', function(){ view.setMonth(view.getMonth()-1); render(); });
  document.getElementById('nextM').addEventListener('click', function(){ view.setMonth(view.getMonth()+1); render(); });
  render();

  /* ---------- 书本卡片：按点击位置 3D 倾斜，保持 0.5 秒后跳转 ---------- */
  var cards = document.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener('click', function(ev){
      var card = this;
      ev.preventDefault();
      if(card.dataset.tilting) return;
      card.dataset.tilting = '1';
      var r = card.getBoundingClientRect();
      var w = r.width || card.offsetWidth || 1;
      var h = r.height || card.offsetHeight || 1;
      var hasPoint = (ev.detail !== 0) || !!(ev.clientX || ev.clientY);
      var px = hasPoint ? (ev.clientX - r.left) / w : 0.5;
      var py = hasPoint ? (ev.clientY - r.top) / h : 0.5;
      px = Math.max(0, Math.min(1, px));
      py = Math.max(0, Math.min(1, py));
      var rx = ((0.5 - py) * 16).toFixed(2);
      var ry = ((px - 0.5) * 16).toFixed(2);
      card.style.transition = 'transform .12s ease-out, box-shadow .12s ease-out';
      card.style.transform = 'perspective(1000px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale(1.02)';
      card.style.boxShadow = '0 18px 40px rgba(91,66,160,.32), 0 0 0 4px rgba(255,214,110,.4)';
      card.style.zIndex = '5';
      var target = (location.protocol === 'file:') ? card.getAttribute('href') : card.getAttribute('data-online');
      setTimeout(function(){ location.href = target; }, 500);
    });
  }
})();
</script>
