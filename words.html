<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红火箭分级阅读单词表 · 单词卡片</title>
<style>
  :root{
    --bg:#e7f3ea;
    --ink:#2f3d35; --sub:#7d8f84;

    --card-face:#ffffff;
    --shadow:0 2px 6px rgba(47,125,85,.10),0 8px 24px rgba(47,125,85,.12);
    --shadow-lift:0 4px 10px rgba(47,125,85,.14),0 18px 40px rgba(47,125,85,.20);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding:32px 24px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}

  /* ===== 顶部固定栏：标题+搜索框+统计行吸顶，滚动时不动 ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--bg);
    padding:8px 0 14px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(47,125,85,.08);
  }
  /* ===== 标题 ===== */
  header{text-align:center;margin-bottom:26px}
  header h1{margin-top:6px}
  h1{
    font-size:34px;font-weight:800;letter-spacing:1px;
    color:var(--accent2);
  }
  .subtitle{margin-top:6px;color:var(--sub);font-size:13px;letter-spacing:2px}

  /* ===== 搜索框 ===== */
  .searchbar{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:8px}
  .searchbox{
    position:relative;width:420px;max-width:100%;
  }
  /* 排序按钮 */
  .sortbtns{display:flex;gap:8px;flex-shrink:0}
  .sbtn{
    height:40px;padding:0 16px;border-radius:20px;cursor:pointer;
    border:1px solid #cfe2d5;background:rgba(255,255,255,.85);
    color:#5f7268;font-size:13.5px;font-weight:600;letter-spacing:.5px;
    transition:all .15s;user-select:none;
  }
  .sbtn:hover{transform:translateY(-1px);border-color:#8fbca0;color:var(--accent2)}
  .sbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(47,125,85,.30)}
  .searchbox input{
    width:100%;height:46px;border:none;outline:none;
    border-radius:23px;padding:0 46px 0 46px;font-size:15px;color:var(--ink);
    background:var(--card-face);
    box-shadow:var(--shadow), inset 0 -2px 0 rgba(43,58,85,.06);
    transition:box-shadow .2s, transform .2s;
  }
  .searchbox input:focus{
    box-shadow:var(--shadow-lift), inset 0 -2px 0 rgba(63,157,107,.25);
    transform:translateY(-1px);
  }
  .searchbox .icon{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:17px;color:var(--sub);pointer-events:none;
  }
  .searchbox .clear{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:#dcebe1;color:var(--sub);font-size:12px;line-height:1;display:none;
  }
  .searchbox .clear:hover{background:#c9e0d2}
  .count{ text-align:center;color:var(--sub);font-size:12.5px;margin:8px 0 22px }

  /* ===== 瀑布流（3列） ===== */
  .grid{display:flex;gap:22px;align-items:flex-start}
  .col{flex:1;min-width:0;display:flex;flex-direction:column}
  @media (max-width:980px){.grid{gap:16px}}
  @media (max-width:640px){.grid{gap:14px}}
  .scene{
    margin-bottom:22px;
    perspective:1400px;height:390px;
  }

  /* ===== 卡片本体 ===== */
  .card{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.2,.75,.3,1.1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:18px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:var(--shadow);
    overflow:hidden;
    /* 毛玻璃：背景模糊20 + 绿色15%透明 + 绿色细边 */
    background:rgba(34,197,94,.15);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border:1px solid rgba(34,197,94,.55);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .face{background:rgba(255,255,255,.88)}  /* 不支持毛玻璃时的兜底 */
  }
  .scene:hover .card:not(.flipped){transform:translateY(-8px) rotateX(4deg)}
  .scene:hover .card{box-shadow:var(--shadow-lift)}

  /* ---- 正面 ---- */
  .front{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:transparent;
  }
  .ring{
    width:150px;height:150px;border-radius:50%;
    border:2px dashed rgba(63,157,107,.45);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    background:#ffffff;

  .abbr{
    margin-top:14px;padding:3px 14px;border-radius:12px;
    background:var(--accent);
    color:#fff;font-size:13px;font-weight:600;letter-spacing:1px;
    box-shadow:0 4px 10px rgba(47,125,85,.30);
  }
  .hint{position:absolute;bottom:16px;color:#8ba394;font-size:11.5px;letter-spacing:1px}

  /* ---- 播放按钮 ---- */
  .play{
    margin-top:18px;
    display:flex;align-items:center;gap:8px;
    padding:9px 22px;border-radius:24px;cursor:pointer;
    border:1px solid rgba(34,197,94,.55);
    background:rgba(34,197,94,.15);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#1e7a45;font-size:13.5px;font-weight:700;letter-spacing:1px;
    box-shadow:0 4px 12px rgba(34,197,94,.22), inset 0 1px 3px rgba(255,255,255,.55);
    transition:transform .18s, box-shadow .18s, background .18s;
    user-select:none;
  }
  .play:hover{
    transform:translateY(-2px) scale(1.03);
    background:rgba(34,197,94,.28);
    box-shadow:0 8px 20px rgba(34,197,94,.35), inset 0 1px 3px rgba(255,255,255,.7);
  }
  .play:active{transform:scale(.96)}
  .play .spk{font-size:16px;line-height:1}
  .play.speaking{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 12px rgba(34,197,94,.22), inset 0 1px 3px rgba(255,255,255,.55)}
    50%{box-shadow:0 4px 20px rgba(34,197,94,.6), inset 0 1px 3px rgba(255,255,255,.7)}
  }

  /* ---- 记忆度按钮：会 / 半熟 / 忘了 ---- */
  .memo{
    margin-top:14px;display:flex;gap:10px;user-select:none;
  }
  .m{
    padding:6px 14px;border-radius:16px;cursor:pointer;
    font-size:13px;font-weight:600;letter-spacing:.5px;
    border:1px solid #cfe2d5;background:rgba(255,255,255,.75);
    color:#5f7268;transition:all .15s;
  }
  .m:hover{transform:translateY(-1px);border-color:#8fbca0}
  .m.on-know{background:#3f9d6b;border-color:#3f9d6b;color:#fff;box-shadow:0 3px 8px rgba(47,125,85,.30)}
  .m.on-half{background:#d19a3d;border-color:#d19a3d;color:#fff;box-shadow:0 3px 8px rgba(160,110,30,.30)}
  .m.on-forget{background:#c2685c;border-color:#c2685c;color:#fff;box-shadow:0 3px 8px rgba(150,70,60,.30)}

  /* ---- 背面 ---- */
  .back{
    transform:rotateY(180deg);
    display:flex;flex-direction:column;
  }
  .back::before{
    content:"";position:absolute;left:0;right:0;top:0;height:6px;
    background:var(--accent);
  }
  .back-inner{flex:1;overflow-y:scroll;padding:18px 18px 14px}
  /* 右侧滚动条：常驻可见 */
  .back-inner::-webkit-scrollbar{width:8px}
  .back-inner::-webkit-scrollbar-track{background:#eef5f0;border-radius:4px}
  .back-inner::-webkit-scrollbar-thumb{background:#a9cfb8;border-radius:4px}
  .back-inner::-webkit-scrollbar-thumb:hover{background:#8fbca0}
  .bhead{text-align:center;padding-bottom:10px;border-bottom:1px dashed #d7e8dc;margin-bottom:10px}
  .bword{font-size:26px;font-weight:800;color:var(--accent2)}
  .bipa{color:var(--accent);font-size:16px;margin-top:3px;font-family:"Segoe UI",Consolas,serif}
  .row{margin:8px 0;font-size:15px;line-height:1.6}
  .lab{
    display:inline-block;min-width:48px;margin-right:8px;
    font-size:13px;font-weight:700;color:#fff;text-align:center;
    padding:1.5px 9px;border-radius:10px;vertical-align:2px;
    background:var(--accent);
  }

  .lab.lab-morph{background:#d19a3d}
  .lab.lab-ex{background:#8aa094}
  .val{color:var(--ink)}
  .ex{display:block;color:#546b5d;margin-top:4px;padding-left:2px}
  .ex b{color:var(--accent);font-weight:600}
  .flipback{
    text-align:center;color:#a3b3a8;font-size:12px;padding:7px 0 9px;
    border-top:1px dashed #d7e8dc;letter-spacing:1px;
  }
  .noresult{
    text-align:center;color:var(--sub);font-size:15px;padding:60px 0;display:none;
  }
</style>
</head>

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function buildCard(w){
  const exHtml = w.exs.map((e,i)=>`<span class="ex"><b>${i+1}、</b>${esc(e)}</span>`).join("");
  return `
    <div class="card">
      <div class="face front">
        <div class="ring"><div class="word">${esc(w.word)}</div></div>
        <div class="abbr">${esc(w.abbr)}</div>
        <div class="play" data-word="${esc(w.word)}"><span class="spk">🔊</span>播放发音</div>
        <div class="memo" data-word="${esc(w.word)}">
          <span class="m" data-m="know">会</span>
          <span class="m" data-m="half">半熟</span>
          <span class="m" data-m="forget">忘了</span>
        </div>
        <div class="hint">— 点击卡片翻面 —</div>
      </div>
      <div class="face back">
        <div class="back-inner">
          <div class="bhead">
            <div class="bword">${esc(w.word)}</div>
            <div class="bipa">${esc(w.abbr)}&nbsp;&nbsp;${esc(w.ipa)}</div>
          </div>
          <div class="row"><span class="lab">中文</span><span class="val">${esc(w.meaning)}</span></div>
          <div class="row"><span class="lab lab-en">英文</span><span class="val">${esc(w.en)}</span></div>
          <div class="row"><span class="lab lab-morph">形态</span><span class="val">${esc(w.morph)}</span></div>
          <div class="row"><span class="lab lab-ex">例句</span>${exHtml}</div>
        </div>
        <div class="flipback">— 点击返回 —</div>
      </div>
    </div>`;
}

/* 懒加载：先建空壳占位（高度固定 390px 不跳动），滚近了才填入卡片内容 */
const grid=document.getElementById("grid");
const scenes=WORDS.map((w,i)=>{
  const s=document.createElement("div");
  s.className="scene";
  s.dataset.idx=i;
  s.dataset.key=w.word+"|"+w.meaning;
  return s;
});
function fillScene(s){
  if(s.dataset.filled) return;
  s.dataset.filled="1";
  s.innerHTML=buildCard(WORDS[+s.dataset.idx]);
  applyMemo(WORDS[+s.dataset.idx].word,s);
}
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ fillScene(e.target); io.unobserve(e.target); }
  });
},{rootMargin:"900px 0px"});   /* 提前 900px 预渲染，滚动无白块 */
scenes.forEach(s=>io.observe(s));

/* JS 瀑布流：卡片按序号轮流分入各列（i % 列数），保证每行卡片数 = 列数 */
let cols=[];
let order=WORDS.map((_,i)=>i);   /* 当前展示顺序（索引数组） */
let sortMode="orig";             /* orig=原始顺序 / rand=随机 / alpha=字母 */
function colCount(){
  const w=window.innerWidth;
  return w<=640?1:(w<=980?2:3);
}
function distribute(){
  const n=colCount();
  if(n===cols.length) return;
  grid.innerHTML="";
  cols=[];
  for(let i=0;i<n;i++){
    const c=document.createElement("div");
    c.className="col";
    grid.appendChild(c); cols.push(c);
  }
  order.forEach((idx,i)=>cols[i%n].appendChild(scenes[idx]));
}

/* 排序：随机 / 字母（再点一次恢复原始顺序） */
const btnRandom=document.getElementById("btnRandom");
const btnAlpha=document.getElementById("btnAlpha");
function refreshView(){
  btnRandom.classList.toggle("active",sortMode==="rand");
  btnAlpha.classList.toggle("active",sortMode==="alpha");
  cols.forEach(c=>c.innerHTML="");
  const n=colCount();
  order.forEach((idx,i)=>cols[i%n].appendChild(scenes[idx]));
  update();
}
btnRandom.addEventListener("click",()=>{
  order=WORDS.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  sortMode="rand"; refreshView();
});
btnAlpha.addEventListener("click",()=>{
  if(sortMode==="alpha"){        /* 再点一次 → 恢复原始顺序 */
    order=WORDS.map((_,i)=>i); sortMode="orig";
  }else{
    order=WORDS.map((_,i)=>i)
      .sort((a,b)=>WORDS[a].word.localeCompare(WORDS[b].word,undefined,{sensitivity:"base"}));
    sortMode="alpha";
  }
  refreshView();
});

/* 翻转 + 记忆度选择 */
grid.addEventListener("click",e=>{
  const play=e.target.closest(".play");
  if(play){ speak(play.dataset.word,play); return; }   /* 播放按钮不触发翻面 */
  const mb=e.target.closest(".m");
  if(mb){ setMemo(mb.parentElement.dataset.word, mb.dataset.m, mb); return; } /* 记忆度按钮不触发翻面 */
  const card=e.target.closest(".card");
  if(card) card.classList.toggle("flipped");
});

/* 记忆度：会/半熟/忘了，单选，localStorage 持久保存 */
const MEMO_KEY="rocket_words_memo";
let memo={};
try{ memo=JSON.parse(localStorage.getItem(MEMO_KEY)||"{}"); }catch(_){ memo={}; }
const ON={know:"on-know",half:"on-half",forget:"on-forget"};
const WORD_IDX=new Map(WORDS.map((w,i)=>[w.word,i]));
function applyMemo(word,scene){
  scene = scene || scenes[WORD_IDX.get(word)];
  if(!scene || !scene.dataset.filled) return;
  const cur=memo[word];
  scene.querySelectorAll(".m").forEach(el=>{
    el.className="m"+(cur&&ON[cur]===ON[el.dataset.m]?" "+ON[el.dataset.m]:"");
  });
}
function setMemo(word,val,el){
  /* 再点一次已选项 = 取消选择 */
  memo[word] = (memo[word]===val) ? undefined : val;
  if(!memo[word]) delete memo[word];
  try{ localStorage.setItem(MEMO_KEY,JSON.stringify(memo)); }catch(_){}
  applyMemo(word);
  update();   /* 顶部统计随选择实时刷新 */
}
/* 统计：会/半熟/忘了 各多少个 */
function memoStats(){
  let know=0,half=0,forget=0;
  for(const v of Object.values(memo)){
    if(v==="know") know++;
    else if(v==="half") half++;
    else if(v==="forget") forget++;
  }
  return `（其中会了 ${know} 个，半熟 ${half} 个，忘了 ${forget} 个）`;
}

/* 单词发音：Web Speech API */
let enVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  enVoice = vs.find(v=>/^en(-|_)(GB|US)$/i.test(v.lang) && /female|Google|Samantha|Serena/i.test(v.name))
         || vs.find(v=>/^en(-|_)GB$/i.test(v.lang))
         || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(word,btn){
  if(!("speechSynthesis" in window)){ alert("当前浏览器不支持语音播放"); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang="en-GB"; if(enVoice) u.voice=enVoice;
  u.rate=0.75;          /* 慢速，适合小学生听清 */
  u.pitch=1.05;
  if(btn){
    btn.classList.add("speaking");
    u.onend=()=>btn.classList.remove("speaking");
    u.onerror=()=>btn.classList.remove("speaking");
  }
  speechSynthesis.speak(u);
}

/* 搜索：只匹配 单词本身 + 中文释义（子串匹配），英文释义/例句等不参与 */
const q=document.getElementById("q"), clear=document.getElementById("clear");
const count=document.getElementById("count"), noresult=document.getElementById("noresult");

function update(){
  const raw=q.value.trim().toLowerCase();
  clear.style.display=raw?"block":"none";
  const visible=[];
  for(const idx of order){
    const s=scenes[idx];
    const key=s.dataset.key.toLowerCase();
    const hit = !raw || key.includes(raw);
    if(hit) visible.push(s);
  }
  /* 把命中的卡片重新按 i%列数 分入各列，保证每行满列 */
  const n=colCount();
  cols.forEach(c=>c.innerHTML="");
  visible.forEach((s,i)=>cols[i%n].appendChild(s));
  count.textContent = (raw ? `匹配到 ${visible.length} 张卡片` : `共 ${WORDS.length} 张卡片`) + memoStats();
  noresult.style.display=visible.length?"none":"block";
}
q.addEventListener("input",update);
clear.addEventListener("click",()=>{q.value="";update();q.focus()});
distribute();
update();
let lastCols=colCount();
window.addEventListener("resize",()=>{
  const n=colCount();
  if(n!==lastCols){ lastCols=n; distribute(); update(); }
});
</script>
